# Render Blueprint — provisions Postgres, a combined web+worker service, and the frontend.
# Connect this repo to Render and click "Apply Blueprint".
#
# Note on free-tier constraint:
# Render's free plan no longer includes standalone background workers, so we run
# gunicorn AND the django-q cluster as sibling processes inside the single web
# service container, supervised by `honcho`. See backend/Procfile.

databases:
  - name: playto-pg
    plan: free
    databaseName: playto
    user: playto

services:
  - type: web
    name: playto-web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py setup_schedules
      python manage.py seed
    # honcho reads backend/Procfile and runs `web` (gunicorn) + `worker` (qcluster)
    # as foreground children. If either dies, honcho exits and Render restarts
    # the whole container — both come back up together.
    startCommand: honcho start
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-pg
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: require

  - type: web
    name: playto-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # set to your playto-web URL after first deploy, e.g. https://playto-web.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
