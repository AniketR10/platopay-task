# Render Blueprint — provisions Postgres, web, worker, and frontend in one go.
# Connect this repo to Render and click "Apply Blueprint".

databases:
  - name: playto-pg
    plan: free
    databaseName: playto
    user: playto

services:
  - type: web
    name: playto-web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py setup_schedules
      python manage.py seed
    startCommand: gunicorn playto.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-pg
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: require

  - type: worker
    name: playto-worker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: SECRET_KEY
        sync: false  # set to same value as playto-web
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-pg
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: require

  - type: web
    name: playto-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # set to your playto-web URL after first deploy, e.g. https://playto-web.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
